name: CI

# Baseline checks on pull requests, so the gentinel bot PR clean-up can merge
# dependency updates once they pass. Also runs on main: the clean-up ignores
# checks that already fail on the default branch.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=
